[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primeaiexplorer"
version = "1.0.0a5"
description = "PrimeAIExplorer v1.0 alpha surprise-observatory research platform"
requires-python = ">=3.10"
authors = [{name = "PrimeAIExplorer"}]
dependencies = []

[project.scripts]
paiexp = "primeaiexplorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
workspace = ["prompt-toolkit>=3.0"]
